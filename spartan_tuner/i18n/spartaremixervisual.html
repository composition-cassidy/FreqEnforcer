<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sparta Remix Visual Maker</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- JSZip for saving/loading projects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <!-- Import Map -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.263.1"
        }
    }
    </script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #171717; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #404040; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #525252; }
        body { background-color: #171717; color: white; overflow: hidden; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useRef, useEffect, useMemo, useLayoutEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Play, Pause, Upload, Music, Video, Scissors, 
            Monitor, RefreshCw, X, Plus, Trash2, Move, Maximize, Volume2,
            Grid, Layers, Settings, Film, FlipHorizontal, Square, MonitorPlay, Magnet,
            Minimize2, Palette, Activity, Download, Ratio, GripVertical, Type,
            FolderUp, FolderDown, Save
        } from 'lucide-react';

        // --- ToneJS Loader Hook ---
        const useMidiLibrary = () => {
            const [loaded, setLoaded] = useState(false);
            useEffect(() => {
                if (window.Midi) { setLoaded(true); return; }
                const script = document.createElement('script');
                script.src = 'https://unpkg.com/@tonejs/midi';
                script.async = true;
                script.onload = () => setLoaded(true);
                document.body.appendChild(script);
            }, []);
            return loaded;
        };

        // --- Helpers ---
        const getExtension = (filename) => {
            return filename.slice((filename.lastIndexOf(".") - 1 >>> 0) + 2);
        }

        const INITIAL_VISUAL_STATE = (id) => ({
            id,
            name: `Layer ${id}`, 
            videoSrc: null,
            videoFile: null, // Stored for saving
            videoOffset: 0,
            videoDuration: 10,
            sourceRatio: 16/9,
            midiData: null,
            midiFile: null, // Stored for saving
            midiFileName: null,
            selectedTrackIndex: 0,
            pitchMode: false, 
            flipMode: true,
            monochrome: false, 
            velocityMode: false, 
            x: 10,  
            y: 10,
            width: 40, 
        });

        const RATIO_VALUES = { "16:9": 16/9, "4:3": 4/3, "1:1": 1, "9:16": 9/16, "21:9": 21/9 };

        function SpartaVisualMaker() {
            const midiLibraryLoaded = useMidiLibrary();

            // --- Global State ---
            const [visuals, setVisuals] = useState([INITIAL_VISUAL_STATE(1)]);
            const [activeVisualId, setActiveVisualId] = useState(1);
            const [stageRatio, setStageRatio] = useState("16:9");
            const [snapToGrid, setSnapToGrid] = useState(false);
            const [highPrecision, setHighPrecision] = useState(false); 
            const [renderHeight, setRenderHeight] = useState(1080); 

            // Audio Backing Track State
            const [audioSrc, setAudioSrc] = useState(null);
            const [audioFile, setAudioFile] = useState(null); // Stored for saving
            const [audioFileName, setAudioFileName] = useState(null);

            // Playback State
            const [isPlaying, setIsPlaying] = useState(false);
            const [isRecording, setIsRecording] = useState(false); 
            const [playbackTime, setPlaybackTime] = useState(0);
            const [globalDuration, setGlobalDuration] = useState(10);
            
            // Drag & Drop State
            const [draggedItemIndex, setDraggedItemIndex] = useState(null);

            // Real-time Visual State
            const [visualStates, setVisualStates] = useState({}); 

            // Refs
            const requestRef = useRef();
            const startTimeRef = useRef(0);
            const lastNoteRefs = useRef({}); 
            const containerRef = useRef(null); 
            const stageParentRef = useRef(null); 
            const canvasRef = useRef(null); 
            const audioRef = useRef(null); 
            const mediaRecorderRef = useRef(null);
            const recordedChunksRef = useRef([]);

            // Responsive Stage State
            const [stageStyle, setStageStyle] = useState({});

            // Refs for Animation Loop
            const visualsRef = useRef(visuals);
            const visualStatesRef = useRef({});

            useEffect(() => { visualsRef.current = visuals; }, [visuals]);

            // --- Responsive Stage Logic ---
            useLayoutEffect(() => {
                const handleResize = () => {
                    if (!stageParentRef.current) return;
                    const parent = stageParentRef.current;
                    const parentRatio = parent.clientWidth / parent.clientHeight;
                    const targetRatio = RATIO_VALUES[stageRatio];

                    if (parentRatio > targetRatio) {
                        setStageStyle({ height: '100%', width: 'auto', aspectRatio: `${targetRatio}` });
                    } else {
                        setStageStyle({ width: '100%', height: 'auto', aspectRatio: `${targetRatio}` });
                    }
                };
                handleResize();
                const resizeObserver = new ResizeObserver(() => handleResize());
                if (stageParentRef.current) resizeObserver.observe(stageParentRef.current);
                return () => resizeObserver.disconnect();
            }, [stageRatio]); 

            // Dragging/Resizing State
            const [dragState, setDragState] = useState(null);

            // --- Computed ---
            const activeVisual = visuals.find(v => v.id === activeVisualId) || visuals[0];
            const currentGridSize = highPrecision ? 5 : 10; 

            // Update global duration
            useEffect(() => {
                let max = 0;
                visuals.forEach(v => {
                    if (v.midiData && v.midiData.duration > max) max = v.midiData.duration;
                });
                if (audioRef.current && audioRef.current.duration) {
                    if (audioRef.current.duration > max) max = audioRef.current.duration;
                }
                setGlobalDuration(max || 10);
            }, [visuals, audioSrc]);

            // --- SAVE / LOAD PROJECT ---

            const saveProject = async () => {
                if (!window.JSZip) { alert("JSZip library not loaded yet."); return; }
                
                const zip = new JSZip();
                const manifest = {
                    version: "1.0",
                    audioName: audioFileName,
                    visuals: [],
                    globalSettings: { stageRatio, renderHeight }
                };

                // Add Audio
                if (audioFile) {
                    zip.file("audio." + getExtension(audioFile.name), audioFile);
                    manifest.audioPath = "audio." + getExtension(audioFile.name);
                }

                // Process Visuals
                visuals.forEach(v => {
                    // Clone visual config but exclude large binary objects
                    const vMeta = { ...v };
                    delete vMeta.videoSrc;
                    delete vMeta.videoFile;
                    delete vMeta.midiData; // Re-parse on load
                    delete vMeta.midiFile;

                    // Add Video File to Zip
                    if (v.videoFile) {
                        const vName = `visual_${v.id}_video.${getExtension(v.videoFile.name)}`;
                        zip.file(vName, v.videoFile);
                        vMeta.videoZipPath = vName;
                    }

                    // Add Midi File to Zip
                    if (v.midiFile) {
                        const mName = `visual_${v.id}_midi.${getExtension(v.midiFile.name)}`;
                        zip.file(mName, v.midiFile);
                        vMeta.midiZipPath = mName;
                    }

                    manifest.visuals.push(vMeta);
                });

                zip.file("project.json", JSON.stringify(manifest));

                const content = await zip.generateAsync({ type: "blob" });
                const url = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = url;
                a.download = `sparta_project_${Date.now()}.sparta`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const loadProject = async (e) => {
                const file = e.target.files[0];
                if(!file || !window.JSZip) return;

                try {
                    const zip = await JSZip.loadAsync(file);
                    
                    // Read Manifest
                    if (!zip.file("project.json")) { alert("Invalid project file."); return; }
                    const manifestStr = await zip.file("project.json").async("text");
                    const manifest = JSON.parse(manifestStr);

                    // Restore Global Settings
                    if (manifest.globalSettings) {
                        if (manifest.globalSettings.stageRatio) setStageRatio(manifest.globalSettings.stageRatio);
                        if (manifest.globalSettings.renderHeight) setRenderHeight(manifest.globalSettings.renderHeight);
                    }

                    // Restore Audio
                    if (manifest.audioPath && zip.file(manifest.audioPath)) {
                        const audioBlob = await zip.file(manifest.audioPath).async("blob");
                        const audioFile = new File([audioBlob], manifest.audioName || "audio");
                        setAudioSrc(URL.createObjectURL(audioBlob));
                        setAudioFile(audioFile);
                        setAudioFileName(manifest.audioName);
                    } else {
                        // Clear audio if not in project
                        setAudioSrc(null); setAudioFile(null); setAudioFileName(null);
                    }

                    // Restore Visuals
                    const restoredVisuals = [];
                    for (const vMeta of manifest.visuals) {
                        const newV = { ...INITIAL_VISUAL_STATE(vMeta.id), ...vMeta };

                        // Restore Video
                        if (vMeta.videoZipPath && zip.file(vMeta.videoZipPath)) {
                            const vBlob = await zip.file(vMeta.videoZipPath).async("blob");
                            // Fallback name if needed
                            const fName = `video_${vMeta.id}`;
                            newV.videoSrc = URL.createObjectURL(vBlob);
                            newV.videoFile = new File([vBlob], fName);
                        }

                        // Restore MIDI
                        if (vMeta.midiZipPath && zip.file(vMeta.midiZipPath)) {
                            const mBlob = await zip.file(vMeta.midiZipPath).async("blob");
                            const mBuff = await mBlob.arrayBuffer();
                            const fName = `midi_${vMeta.id}`;
                            
                            newV.midiFile = new File([mBlob], fName);
                            // Parse MIDI
                            if (window.Midi) {
                                newV.midiData = new window.Midi(mBuff);
                            }
                        }

                        restoredVisuals.push(newV);
                    }

                    setVisuals(restoredVisuals);
                    if(restoredVisuals.length > 0) setActiveVisualId(restoredVisuals[0].id);

                } catch (err) {
                    console.error(err);
                    alert("Failed to load project: " + err.message);
                }
            };


            // --- Action Handlers (Visual Management) ---

            const addVisual = () => {
                const newId = Math.max(...visuals.map(v => v.id), 0) + 1;
                const newVisual = INITIAL_VISUAL_STATE(newId);
                newVisual.x = 10 + (visuals.length * 2); 
                newVisual.y = 10 + (visuals.length * 2);
                setVisuals([...visuals, newVisual]);
                setActiveVisualId(newId);
            };

            const removeVisual = (id, e) => {
                e.stopPropagation();
                if (visuals.length <= 1) return; 
                const newVisuals = visuals.filter(v => v.id !== id);
                setVisuals(newVisuals);
                if (activeVisualId === id) setActiveVisualId(newVisuals[0].id);
            };

            const updateActiveVisual = (key, value) => {
                setVisuals(prev => prev.map(v => 
                v.id === activeVisualId ? { ...v, [key]: value } : v
                ));
            };

            const updateVisualLayout = (id, updates) => {
                setVisuals(prev => prev.map(v => 
                v.id === id ? { ...v, ...updates } : v
                ));
            };

            // Layer Drag and Drop
            const handleLayerDragStart = (e, index) => {
                setDraggedItemIndex(index);
                e.dataTransfer.effectAllowed = "move";
                e.dataTransfer.setData("text/plain", index);
            };

            const handleLayerDragOver = (e) => e.preventDefault(); 

            const handleLayerDrop = (e, targetIndex) => {
                e.preventDefault();
                if (draggedItemIndex === null || draggedItemIndex === targetIndex) return;
                const newVisuals = [...visuals];
                const item = newVisuals[draggedItemIndex];
                newVisuals.splice(draggedItemIndex, 1);
                newVisuals.splice(targetIndex, 0, item);
                setVisuals(newVisuals);
                setDraggedItemIndex(null);
            };

            // --- File Handlers ---

            const handleVideoUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const url = URL.createObjectURL(file);
                    updateActiveVisual('videoSrc', url);
                    updateActiveVisual('videoFile', file);
                    updateActiveVisual('videoDuration', 10);
                }
            };

            const handleMidiUpload = (e) => {
                const file = e.target.files[0];
                if (file && midiLibraryLoaded) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        try {
                            const midi = new window.Midi(evt.target.result);
                            setVisuals(prev => prev.map(v => 
                                v.id === activeVisualId ? { 
                                ...v, 
                                midiData: midi, 
                                midiFileName: file.name,
                                midiFile: file, // Store original file for save
                                selectedTrackIndex: 0 
                                } : v
                            ));
                        } catch (err) {
                            console.error("Invalid MIDI", err);
                            alert("Could not parse MIDI file.");
                        }
                    };
                    reader.readAsArrayBuffer(file);
                }
            };

            const handleAudioUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const url = URL.createObjectURL(file);
                    setAudioSrc(url);
                    setAudioFile(file); // Store for save
                    setAudioFileName(file.name);
                }
            };

            const removeAudio = (e) => {
                e.stopPropagation(); e.preventDefault();
                setAudioSrc(null); setAudioFile(null); setAudioFileName(null);
                if (isPlaying) stopPlayback();
            };

            // --- Playback & Recorder ---

            const startPlayback = () => {
                setIsPlaying(true);
                if (audioSrc && audioRef.current) {
                    audioRef.current.currentTime = playbackTime;
                    audioRef.current.play().catch(e => console.log("Audio play failed", e));
                } else {
                    startTimeRef.current = performance.now() - (playbackTime * 1000);
                }
                requestRef.current = requestAnimationFrame(animate);
                lastNoteRefs.current = {};
                visualStatesRef.current = {}; 
                document.querySelectorAll('video').forEach(v => { if(v.id !== 'master-audio') v.pause(); });
            };

            const stopPlayback = () => {
                setIsPlaying(false);
                setIsRecording(false); 
                cancelAnimationFrame(requestRef.current);
                if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
                    mediaRecorderRef.current.stop();
                }
                if (audioRef.current) audioRef.current.pause();
                setVisualStates({}); 
                visualStatesRef.current = {}; 
                document.querySelectorAll('video').forEach(v => { if(v.id !== 'master-audio') v.pause(); });
            };

            const resetPlayback = () => {
                stopPlayback();
                setPlaybackTime(0);
                if (audioRef.current) audioRef.current.currentTime = 0;
                lastNoteRefs.current = {};
            };

            const startRecording = () => {
                if (!canvasRef.current || !audioRef.current) return;
                resetPlayback();
                setIsRecording(true);
                recordedChunksRef.current = [];

                const canvasStream = canvasRef.current.captureStream(60); 
                let combinedStream = canvasStream;
                try {
                    const audioStream = audioRef.current.captureStream ? audioRef.current.captureStream() : audioRef.current.mozCaptureStream();
                    if (audioStream) combinedStream = new MediaStream([...canvasStream.getVideoTracks(), ...audioStream.getAudioTracks()]);
                } catch (e) { console.warn("Audio capture issue", e); }

                const options = { mimeType: 'video/webm; codecs=vp9', videoBitsPerSecond: 50000000 };
                try { mediaRecorderRef.current = new MediaRecorder(combinedStream, options); } 
                catch(e) { 
                    try { mediaRecorderRef.current = new MediaRecorder(combinedStream, { videoBitsPerSecond: 50000000 }); } 
                    catch (e2) { mediaRecorderRef.current = new MediaRecorder(combinedStream); }
                }

                mediaRecorderRef.current.ondataavailable = (event) => { if (event.data.size > 0) recordedChunksRef.current.push(event.data); };
                mediaRecorderRef.current.onstop = () => {
                    const blob = new Blob(recordedChunksRef.current, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    document.body.appendChild(a); a.style = 'display: none'; a.href = url;
                    a.download = `sparta-remix-export-${Date.now()}.webm`; a.click();
                    window.URL.revokeObjectURL(url); setIsRecording(false);
                };
                mediaRecorderRef.current.start();
                startPlayback(); 
            };

            // Animation Loop
            const animate = (time) => {
                let currentTimeSec = 0;
                if (audioSrc && audioRef.current) {
                    currentTimeSec = audioRef.current.currentTime;
                    if (audioRef.current.ended) { stopPlayback(); return; }
                } else {
                    currentTimeSec = (time - startTimeRef.current) / 1000;
                }
                setPlaybackTime(currentTimeSec);

                if (!audioSrc && globalDuration > 0 && currentTimeSec > globalDuration + 0.5) { stopPlayback(); return; }

                const canvas = canvasRef.current;
                let ctx = null;
                if (canvas) {
                    const aspect = RATIO_VALUES[stageRatio]; 
                    const targetWidth = Math.round(renderHeight * aspect);
                    if (canvas.width !== targetWidth || canvas.height !== renderHeight) {
                        canvas.width = targetWidth; canvas.height = renderHeight;
                    }
                    ctx = canvas.getContext('2d', { alpha: false });
                    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
                    ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                }

                const newStates = {};
                visualsRef.current.forEach(visual => {
                    let currentNote = null;
                    if (visual.midiData) {
                        const track = visual.midiData.tracks[visual.selectedTrackIndex];
                        if (track) currentNote = track.notes.find(n => currentTimeSec >= n.time && currentTimeSec < (n.time + n.duration));
                    }

                    const prevFlip = visualStatesRef.current[visual.id]?.flipState || false;
                    let newFlip = prevFlip;

                    if (currentNote && lastNoteRefs.current[visual.id] !== currentNote) {
                        if (visual.flipMode) newFlip = !prevFlip; 
                        const vidEl = document.getElementById(`video-${visual.id}`);
                        if (vidEl) {
                            vidEl.currentTime = visual.videoOffset;
                            if (visual.pitchMode && currentNote.midi) {
                                vidEl.playbackRate = Math.min(Math.max(Math.pow(2, (currentNote.midi - 60) / 12), 0.5), 4.0); 
                            } else { vidEl.playbackRate = 1; }
                            vidEl.play().catch(() => {});
                        }
                        lastNoteRefs.current[visual.id] = currentNote;
                    } else if (!currentNote) {
                        if (lastNoteRefs.current[visual.id] !== null) {
                            lastNoteRefs.current[visual.id] = null;
                            const vidEl = document.getElementById(`video-${visual.id}`);
                            if (vidEl && !vidEl.paused) vidEl.pause();
                        }
                    }
                    if (!visual.flipMode) newFlip = false;

                    newStates[visual.id] = { activeNote: currentNote, flipState: newFlip };

                    if (ctx && canvas) {
                        const vidEl = document.getElementById(`video-${visual.id}`);
                        if (currentNote && vidEl) {
                            let opacity = 1;
                            if (visual.velocityMode) opacity = Math.min(1, (currentNote.velocity || 1) * 1.35);
                            
                            const x = (visual.x / 100) * canvas.width;
                            const y = (visual.y / 100) * canvas.height;
                            const w = (visual.width / 100) * canvas.width;
                            const h = w / visual.sourceRatio; 

                            ctx.save();
                            ctx.globalAlpha = opacity;
                            if (visual.monochrome) ctx.filter = 'grayscale(100%)';
                            if (newFlip) {
                                ctx.translate(x + w/2, y + h/2); ctx.scale(-1, 1); ctx.translate(-(x + w/2), -(y + h/2));
                            }
                            ctx.drawImage(vidEl, x, y, w, h);
                            ctx.restore();
                        }
                    }
                });
                visualStatesRef.current = newStates;
                setVisualStates(newStates);
                requestRef.current = requestAnimationFrame(animate);
            };
            useEffect(() => { return () => cancelAnimationFrame(requestRef.current); }, []);

            // --- Grid Interaction ---
            const handleStageMouseDown = (e, visual, type) => {
                if (isPlaying) return;
                e.preventDefault(); e.stopPropagation();
                setActiveVisualId(visual.id); 
                setDragState({ id: visual.id, type, startX: e.clientX, startY: e.clientY, initialX: visual.x, initialY: visual.y, initialW: visual.width });
            };
            const handleStageMouseMove = (e) => {
                if (!dragState || !containerRef.current) return;
                const rect = containerRef.current.getBoundingClientRect();
                const deltaX = ((e.clientX - dragState.startX) / rect.width) * 100;
                const deltaY = ((e.clientY - dragState.startY) / rect.height) * 100;
                const gridSize = highPrecision ? 5 : 10;

                if (dragState.type === 'move') {
                    let nextX = Math.min(Math.max(dragState.initialX + deltaX, 0), 100);
                    let nextY = Math.min(Math.max(dragState.initialY + deltaY, 0), 100);
                    if (snapToGrid) {
                        nextX = Math.round(nextX / gridSize) * gridSize;
                        nextY = Math.round(nextY / gridSize) * gridSize;
                    }
                    updateVisualLayout(dragState.id, { x: nextX, y: nextY });
                } else if (dragState.type === 'resize') {
                    let nextW = Math.max(gridSize, dragState.initialW + deltaX); 
                    if (snapToGrid) nextW = Math.round(nextW / gridSize) * gridSize;
                    updateVisualLayout(dragState.id, { width: nextW });
                }
            };
            const handleStageMouseUp = () => setDragState(null);
            useEffect(() => {
                if (dragState) {
                    window.addEventListener('mousemove', handleStageMouseMove);
                    window.addEventListener('mouseup', handleStageMouseUp);
                    return () => { window.removeEventListener('mousemove', handleStageMouseMove); window.removeEventListener('mouseup', handleStageMouseUp); };
                }
            }, [dragState, highPrecision, snapToGrid]);

            // --- Render ---
            const trackOptions = useMemo(() => {
                if (!activeVisual || !activeVisual.midiData) return [];
                return activeVisual.midiData.tracks.map((track, idx) => ({ id: idx, name: track.name || `Track ${idx + 1} (${track.instrument.name})`, noteCount: track.notes.length }));
            }, [activeVisual?.midiData]);

            return (
                <div className="min-h-screen bg-neutral-900 text-neutral-100 font-sans p-2 md:p-6 flex flex-col items-center">
                <audio id="master-audio" ref={audioRef} src={audioSrc} crossOrigin="anonymous" onEnded={stopPlayback} />

                {/* HEADER */}
                <header className="w-full max-w-7xl mb-6 flex flex-col md:flex-row justify-between items-center border-b border-neutral-800 pb-4 gap-4">
                    <div>
                    <h1 className="text-3xl font-black italic tracking-tighter bg-gradient-to-r from-red-500 to-purple-600 bg-clip-text text-transparent flex items-center gap-2">
                        <Layers className="text-red-500" /> SPARTA <span className="text-white not-italic font-light">REMIXER</span>
                    </h1>
                    <p className="text-neutral-500 text-xs font-mono mt-1">v3.5 • SAVE & LOAD</p>
                    </div>
                    
                    <div className="flex gap-4 items-center">
                        {/* Project Actions */}
                        <div className="flex bg-neutral-800 rounded p-1 gap-1">
                            <button onClick={saveProject} className="flex items-center gap-1 px-3 py-1 text-xs rounded hover:bg-neutral-600 transition" title="Save Project (.sparta)">
                                <Save size={14} /> <span>SAVE</span>
                            </button>
                            <label className="flex items-center gap-1 px-3 py-1 text-xs rounded hover:bg-neutral-600 transition cursor-pointer" title="Load Project">
                                <FolderUp size={14} /> <span>LOAD</span>
                                <input type="file" className="hidden" accept=".sparta,.zip" onChange={loadProject} />
                            </label>
                        </div>

                        {/* Resolution */}
                        <div className="flex bg-neutral-800 rounded p-1 hidden sm:flex">
                            <button onClick={() => setRenderHeight(720)} className={`px-2 py-1 text-[10px] rounded ${renderHeight === 720 ? 'bg-neutral-600 font-bold' : 'text-neutral-500'}`}>HD</button>
                            <button onClick={() => setRenderHeight(1080)} className={`px-2 py-1 text-[10px] rounded ${renderHeight === 1080 ? 'bg-neutral-600 font-bold' : 'text-neutral-500'}`}>FHD</button>
                            <button onClick={() => setRenderHeight(2160)} className={`px-2 py-1 text-[10px] rounded ${renderHeight === 2160 ? 'bg-purple-600 font-bold' : 'text-neutral-500'}`}>4K</button>
                        </div>

                        <label className={`flex items-center gap-2 px-3 py-2 rounded-full cursor-pointer transition border ${audioSrc ? 'bg-indigo-500/10 text-indigo-400 border-indigo-500/30' : 'bg-neutral-800 text-neutral-400 border-neutral-700 hover:border-neutral-500'}`}>
                            <Volume2 size={16} />
                            <span className="text-xs font-bold truncate max-w-[100px] hidden sm:block">{audioFileName || "Audio"}</span>
                            <input type="file" className="hidden" accept="audio/*" onChange={handleAudioUpload} />
                            {audioSrc && <div onClick={removeAudio} className="hover:text-red-400 p-1"><X size={12} /></div>}
                        </label>

                        <div className="flex bg-neutral-800 rounded-lg p-1 gap-1 border border-neutral-700">
                            <button onClick={isRecording ? stopPlayback : startRecording} className={`px-4 py-2 rounded flex items-center gap-2 font-bold transition-all ${isRecording ? 'bg-red-600 text-white animate-pulse' : 'bg-neutral-700 text-neutral-300 hover:bg-neutral-600'}`}>
                                {isRecording ? <Square size={16} fill="currentColor"/> : <Download size={16} />}
                                <span className="hidden sm:inline">{isRecording ? 'REC' : 'EXPORT'}</span>
                            </button>
                            <div className="w-px h-full bg-neutral-700 mx-1"></div>
                            <button onClick={isPlaying ? stopPlayback : startPlayback} className={`px-6 py-2 rounded-md flex items-center gap-2 font-bold transition-all shadow-lg ${isPlaying ? 'bg-red-500/20 text-red-500' : 'bg-gradient-to-r from-green-600 to-emerald-600 text-white'}`}>
                                {isPlaying ? <Pause size={18} fill="currentColor" /> : <Play size={18} fill="currentColor" />} 
                            </button>
                            <button onClick={resetPlayback} className="px-3 py-2 bg-neutral-700 hover:bg-neutral-600 rounded text-neutral-300"><RefreshCw size={18} /></button>
                        </div>
                    </div>
                </header>

                <div className="w-full max-w-7xl grid grid-cols-1 lg:grid-cols-12 gap-6 h-[calc(100vh-150px)]">
                    <div className="lg:col-span-4 flex flex-col gap-4 h-full overflow-hidden">
                        <div className="flex flex-wrap gap-1 items-end border-b border-neutral-800 pb-2 overflow-x-auto min-h-[40px]">
                            {visuals.map((v, index) => (
                            <div key={v.id} draggable onDragStart={(e) => handleLayerDragStart(e, index)} onDragOver={handleLayerDragOver} onDrop={(e) => handleLayerDrop(e, index)} onClick={() => setActiveVisualId(v.id)}
                                className={`relative group flex items-center gap-2 px-3 py-2 rounded-t-lg cursor-grab active:cursor-grabbing border-t border-x border-b-0 transition-all select-none min-w-[80px] justify-between ${activeVisualId === v.id ? 'bg-neutral-800 border-neutral-600 text-white z-10' : 'bg-neutral-900 border-neutral-800 text-neutral-500 hover:bg-neutral-800 hover:text-neutral-300'} ${draggedItemIndex === index ? 'opacity-50 border-dashed border-neutral-500' : ''}`}
                                style={{ marginBottom: activeVisualId === v.id ? '-1px' : '0' }}>
                                <div className="flex items-center gap-2 max-w-[100px]">
                                    <GripVertical size={10} className="text-neutral-600 cursor-grab" />
                                    <span className="font-mono font-bold text-xs truncate">{v.name || `Layer ${v.id}`}</span>
                                </div>
                                {visuals.length > 1 && <button onClick={(e) => removeVisual(v.id, e)} className="opacity-0 group-hover:opacity-100 hover:text-red-400 p-1"><X size={10} /></button>}
                            </div>
                            ))}
                            <button onClick={addVisual} className="px-2 py-2 rounded-lg hover:bg-neutral-800 text-neutral-500 hover:text-green-400 mb-1"><Plus size={18} /></button>
                        </div>

                        <div className="flex-1 overflow-y-auto pr-2 custom-scrollbar bg-neutral-900 space-y-4">
                            <div className="bg-neutral-800/50 rounded-xl p-4 border border-neutral-700/50">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="font-bold text-neutral-200 flex items-center gap-2"><Settings size={16} /> Config</h2>
                                    <div className="text-[10px] font-mono bg-black/30 px-2 py-1 rounded text-neutral-400">#{activeVisual.id}</div>
                                </div>
                                <div className="mb-4 bg-black/30 p-2 rounded border border-neutral-700">
                                    <label className="flex items-center gap-2 text-[10px] font-bold text-neutral-500 uppercase mb-1"><Type size={10} /> Name</label>
                                    <input type="text" className="w-full bg-transparent text-sm text-white font-mono focus:outline-none" value={activeVisual.name} onChange={(e) => updateActiveVisual('name', e.target.value)} placeholder={`Layer ${activeVisual.id}`} />
                                </div>
                                <div className="mb-6">
                                    <label className="flex items-center gap-2 text-xs font-bold text-red-400 uppercase mb-2 tracking-wider"><Video size={14} /> Video</label>
                                    {!activeVisual.videoSrc ? (
                                        <label className="group flex flex-col items-center justify-center w-full h-24 border-2 border-dashed border-neutral-700 rounded-lg cursor-pointer hover:border-red-500/50 hover:bg-neutral-800 transition"><Upload className="w-6 h-6 text-neutral-500 mb-2 group-hover:text-red-400" /><span className="text-xs text-neutral-400">Upload Video</span><input type="file" className="hidden" accept="video/*" onChange={handleVideoUpload} /></label>
                                    ) : (
                                        <div className="bg-black rounded-lg p-2 border border-neutral-700 shadow-inner">
                                            <div className="flex items-center justify-between mb-3 border-b border-neutral-800 pb-2"><span className="text-xs text-neutral-300 truncate max-w-[200px]">{activeVisual.videoFile?.name}</span><button onClick={() => updateActiveVisual('videoSrc', null)} className="text-neutral-500 hover:text-red-400"><Trash2 size={12}/></button></div>
                                            <div className="space-y-4">
                                                <div className="space-y-2">
                                                    <div className="flex justify-between text-[10px] text-neutral-500 uppercase font-mono"><span>Start Time</span><span className="text-red-400">{activeVisual.videoOffset.toFixed(2)}s</span></div>
                                                    <input type="range" min="0" max={activeVisual.videoDuration || 10} step="0.01" value={activeVisual.videoOffset} onChange={(e) => updateActiveVisual('videoOffset', parseFloat(e.target.value))} className="w-full h-1 bg-neutral-700 rounded-lg appearance-none cursor-pointer accent-red-500" />
                                                </div>
                                                <div className="space-y-1">
                                                    <div className="flex items-center gap-2 text-[10px] font-bold text-neutral-500 uppercase"><Ratio size={12} /> Aspect Ratio</div>
                                                    <div className="flex gap-2 bg-neutral-900 p-1 rounded">
                                                        {[16/9, 4/3, 1].map(r => (
                                                            <button key={r} onClick={() => updateActiveVisual('sourceRatio', r)} className={`flex-1 text-[10px] py-1 rounded transition-colors ${Math.abs(activeVisual.sourceRatio - r) < 0.01 ? 'bg-red-500 text-white' : 'hover:bg-neutral-800 text-neutral-400'}`}>{r === 1 ? '1:1' : r === 4/3 ? '4:3' : '16:9'}</button>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                                <div>
                                    <label className="flex items-center gap-2 text-xs font-bold text-purple-400 uppercase mb-2 tracking-wider"><Music size={14} /> Midi</label>
                                    {!activeVisual.midiData ? (
                                        <label className="group flex flex-col items-center justify-center w-full h-24 border-2 border-dashed border-neutral-700 rounded-lg cursor-pointer hover:border-purple-500/50 hover:bg-neutral-800 transition"><Upload className="w-6 h-6 text-neutral-500 mb-2 group-hover:text-purple-400" /><span className="text-xs text-neutral-400">Upload .mid</span><input type="file" className="hidden" accept=".mid,.midi" onChange={handleMidiUpload} disabled={!midiLibraryLoaded} /></label>
                                    ) : (
                                        <div className="bg-black rounded-lg p-2 border border-neutral-700 shadow-inner">
                                            <div className="flex items-center justify-between mb-3 border-b border-neutral-800 pb-2"><span className="text-xs text-neutral-300 truncate max-w-[200px]">{activeVisual.midiFileName}</span><button onClick={() => updateActiveVisual('midiData', null)} className="text-neutral-500 hover:text-red-400"><Trash2 size={12}/></button></div>
                                            <div className="space-y-3">
                                                <div>
                                                    <label className="text-[10px] text-neutral-500 uppercase font-mono block mb-1">Select Track</label>
                                                    <select className="w-full bg-neutral-800 border border-neutral-600 text-xs rounded p-2 text-neutral-300 focus:border-purple-500 outline-none" value={activeVisual.selectedTrackIndex} onChange={(e) => updateActiveVisual('selectedTrackIndex', parseInt(e.target.value))}>
                                                        {trackOptions.map((t) => (<option key={t.id} value={t.id}>{t.name} ({t.noteCount} notes)</option>))}
                                                    </select>
                                                </div>
                                                <div className="grid grid-cols-2 gap-2">
                                                    <div className="flex flex-col justify-between bg-neutral-900 p-2 rounded border border-neutral-800 gap-2"><span className="text-[10px] text-neutral-400 uppercase font-bold flex items-center gap-1"><Music size={10} /> Pitch</span><button onClick={() => updateActiveVisual('pitchMode', !activeVisual.pitchMode)} className={`w-full h-5 rounded-full relative transition-colors ${activeVisual.pitchMode ? 'bg-purple-500' : 'bg-neutral-700'}`}><div className={`absolute top-1 w-3 h-3 bg-white rounded-full transition-all ${activeVisual.pitchMode ? 'left-[calc(100%-16px)]' : 'left-1'}`} /></button></div>
                                                    <div className="flex flex-col justify-between bg-neutral-900 p-2 rounded border border-neutral-800 gap-2"><span className="text-[10px] text-neutral-400 uppercase font-bold flex items-center gap-1"><FlipHorizontal size={10} /> Flip</span><button onClick={() => updateActiveVisual('flipMode', !activeVisual.flipMode)} className={`w-full h-5 rounded-full relative transition-colors ${activeVisual.flipMode ? 'bg-purple-500' : 'bg-neutral-700'}`}><div className={`absolute top-1 w-3 h-3 bg-white rounded-full transition-all ${activeVisual.flipMode ? 'left-[calc(100%-16px)]' : 'left-1'}`} /></button></div>
                                                </div>
                                                <div className="grid grid-cols-2 gap-2">
                                                    <div className="flex flex-col justify-between bg-neutral-900 p-2 rounded border border-neutral-800 gap-2"><span className="text-[10px] text-neutral-400 uppercase font-bold flex items-center gap-1"><Palette size={10} /> B&W</span><button onClick={() => updateActiveVisual('monochrome', !activeVisual.monochrome)} className={`w-full h-5 rounded-full relative transition-colors ${activeVisual.monochrome ? 'bg-purple-500' : 'bg-neutral-700'}`}><div className={`absolute top-1 w-3 h-3 bg-white rounded-full transition-all ${activeVisual.monochrome ? 'left-[calc(100%-16px)]' : 'left-1'}`} /></button></div>
                                                    <div className="flex flex-col justify-between bg-neutral-900 p-2 rounded border border-neutral-800 gap-2"><span className="text-[10px] text-neutral-400 uppercase font-bold flex items-center gap-1"><Activity size={10} /> Dynamics</span><button onClick={() => updateActiveVisual('velocityMode', !activeVisual.velocityMode)} className={`w-full h-5 rounded-full relative transition-colors ${activeVisual.velocityMode ? 'bg-purple-500' : 'bg-neutral-700'}`}><div className={`absolute top-1 w-3 h-3 bg-white rounded-full transition-all ${activeVisual.velocityMode ? 'left-[calc(100%-16px)]' : 'left-1'}`} /></button></div>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-8 flex flex-col h-full gap-4">
                        <div className="flex justify-between items-center bg-neutral-900 p-2 px-3 rounded-lg border border-neutral-800">
                            <div className="flex items-center gap-4">
                                <div className="flex items-center gap-2 text-xs font-bold text-neutral-500"><MonitorPlay size={14} /> <span>CANVAS SIZE</span></div>
                                <div className="flex gap-1 bg-neutral-950 p-1 rounded">
                                    {Object.keys(RATIO_VALUES).map(r => (
                                        <button key={r} onClick={() => setStageRatio(r)} className={`text-[10px] px-3 py-1.5 rounded font-mono font-bold transition-all ${stageRatio === r ? 'bg-neutral-700 text-white shadow-sm' : 'hover:bg-neutral-800 text-neutral-500'}`}>{r}</button>
                                    ))}
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setHighPrecision(!highPrecision)} className={`flex items-center gap-2 px-3 py-1.5 rounded text-xs font-bold transition-all border ${highPrecision ? 'bg-blue-500/20 text-blue-400 border-blue-500/50' : 'bg-neutral-800 text-neutral-400 border-neutral-700 hover:bg-neutral-700'}`}><Minimize2 size={14} /> <span>FINE GRID</span></button>
                                <div className="w-px h-6 bg-neutral-800 mx-1"></div>
                                <button onClick={() => setSnapToGrid(!snapToGrid)} className={`flex items-center gap-2 px-3 py-1.5 rounded text-xs font-bold transition-all border ${snapToGrid ? 'bg-purple-500/20 text-purple-400 border-purple-500/50' : 'bg-neutral-800 text-neutral-400 border-neutral-700 hover:bg-neutral-700'}`}><Magnet size={14} /> <span>SNAP TO GRID</span></button>
                            </div>
                        </div>

                        <div ref={stageParentRef} className="flex-1 w-full flex items-center justify-center bg-neutral-900/50 rounded-xl border border-neutral-800 overflow-hidden relative p-4">
                            <div ref={containerRef} className="relative shadow-2xl overflow-hidden transition-all duration-300 bg-black"
                                style={{ ...stageStyle, backgroundImage: isPlaying ? 'none' : `linear-gradient(#222 1px, transparent 1px), linear-gradient(90deg, #222 1px, transparent 1px)`, backgroundSize: `${currentGridSize}% ${currentGridSize}%`, backgroundColor: '#000' }}>
                                <canvas ref={canvasRef} className={`absolute inset-0 w-full h-full pointer-events-none z-[10] ${!isPlaying ? 'opacity-0' : 'opacity-100'}`} />
                                {!isPlaying && visuals.map((visual) => {
                                    const isSelected = activeVisualId === visual.id;
                                    return (
                                        <div key={visual.id} id={`visual-container-${visual.id}`} className={`absolute flex items-center justify-center overflow-hidden transition-all duration-75 group ${isSelected ? 'ring-2 ring-purple-500 z-[999]' : 'hover:ring-1 hover:ring-white/30'}`}
                                            style={{ left: `${visual.x}%`, top: `${visual.y}%`, width: `${visual.width}%`, aspectRatio: `${visual.sourceRatio}`, zIndex: isSelected ? 1000 : 1, cursor: 'move', boxShadow: isSelected ? '0 0 20px rgba(255,255,255,0.1)' : 'none' }}
                                            onMouseDown={(e) => handleStageMouseDown(e, visual, 'move')}>
                                            {visual.videoSrc ? (
                                                <video id={`video-${visual.id}`} src={visual.videoSrc} className="w-full h-full object-cover" style={{ opacity: 1, filter: visual.monochrome ? 'grayscale(100%)' : 'none' }} muted playsInline onLoadedMetadata={(e) => { if(Math.abs(visual.videoDuration - e.target.duration) > 0.1) updateVisualLayout(visual.id, { videoDuration: e.target.duration }); }} />
                                            ) : ( <div className="w-full h-full bg-neutral-900 flex flex-col items-center justify-center text-neutral-600 gap-2"><Monitor size={32} /><span className="text-xs font-mono">NO VIDEO</span></div> )}
                                            <div className="absolute top-0 left-0 bg-purple-500 text-white text-[10px] px-1.5 py-0.5 font-bold font-mono pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity">{visual.name || `#${visual.id}`}</div>
                                            {isSelected && <div className="absolute bottom-0 right-0 w-6 h-6 bg-purple-500 cursor-se-resize flex items-center justify-center text-white z-20 hover:bg-purple-400 transition-colors rounded-tl" onMouseDown={(e) => handleStageMouseDown(e, visual, 'resize')}><Maximize size={10} /></div>}
                                        </div>
                                    );
                                })}
                                {isPlaying && visuals.map((visual) => ( <div key={visual.id} style={{ position: 'absolute', width: 0, height: 0, overflow: 'hidden', opacity: 0 }}>{visual.videoSrc && <video id={`video-${visual.id}`} src={visual.videoSrc} muted playsInline />}</div> ))}
                                {visuals.length === 0 && !isPlaying && <div className="absolute inset-0 flex items-center justify-center text-neutral-600"><p>Click "+" to add a visual layer</p></div>}
                            </div>
                        </div>

                        <div className="h-14 bg-neutral-900 border border-neutral-800 rounded-lg relative select-none overflow-hidden">
                            <div className="absolute inset-0 flex items-center px-0"><div className="w-full h-full relative"><div className="h-full bg-red-500/10 border-r border-red-500 absolute left-0 top-0 transition-all duration-100 ease-linear" style={{ width: `${globalDuration > 0 ? (playbackTime / globalDuration) * 100 : 0}%` }} /></div></div>
                            <div className="absolute top-1 right-2 text-[10px] font-mono text-neutral-500">{playbackTime.toFixed(2)}s / {globalDuration.toFixed(2)}s</div>
                        </div>
                    </div>
                </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<SpartaVisualMaker />);
    </script>
</body>
</html>
